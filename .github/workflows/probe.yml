name: Probe map services
on:
  push:
    branches: [probe-hydro]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS "https://basemap.nationalmap.gov/arcgis/rest/services/USGSHydroCached/MapServer/legend?f=json" -o hydro-legend.json
          jq -c '[.layers[] | {layerId, layerName, n: (.legend|length)}]' hydro-legend.json | head -c 3000
          gh release upload probe hydro-legend.json -R ${{ github.repository }} --clobber
