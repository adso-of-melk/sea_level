name: Probe map services
on:
  push:
    branches: [probe-hydro]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS "https://tiles.arcgis.com/tiles/P3ePLMYs2RVChkJx/arcgis/rest/services/Esri_Hydro_Reference_Overlay/MapServer?f=json" | jq -c '{min: .minLOD, max: .maxLOD, lods: [.tileInfo.lods[].level], copy: .copyrightText}'
          for z in 13 14 15 16; do curl -sS -o /dev/null -w "z$z %{http_code} %{size_download}\n" "https://tiles.arcgis.com/tiles/P3ePLMYs2RVChkJx/arcgis/rest/services/Esri_Hydro_Reference_Overlay/MapServer/tile/$z/$((1582*2**(z-12)))/$((655*2**(z-12)))"; done
