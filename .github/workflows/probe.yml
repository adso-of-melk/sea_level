name: Probe map services
on:
  push:
    branches: [probe-hydro]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://hydro.nationalmap.gov/arcgis/rest/services/wbd/MapServer
          curl -sS "$B?f=json" | jq -c '{caps: .capabilities, single: .singleFusedMapCache, wkid: .spatialReference.latestWkid, maxImg: [.maxImageWidth,.maxImageHeight], copy: .copyrightText, layers: [.layers[] | {id, name, minScale, maxScale}]}'
          curl -sS -o img.png -w "export %{http_code} %{content_type} %{size_download}\n" "$B/export?bbox=-13580000,4530000,-13480000,4630000&bboxSR=3857&imageSR=3857&size=256,256&format=png32&transparent=true&f=image"
          for B2 in https://basemap.nationalmap.gov/arcgis/rest/services; do curl -sS "$B2?f=json" | jq -c '[.services[].name]'; done
