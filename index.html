<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sea Level Globe</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <div id="globe"></div>

  <aside id="panel">
    <button id="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body">
      <span>Sea Level Globe</span><span class="chevron" aria-hidden="true"></span>
    </button>
    <div id="panel-body">

      <fieldset>
        <legend>Base map</legend>
        <label><input type="radio" name="base" value="relief" checked> Shaded relief</label>
        <label><input type="radio" name="base" value="satellite"> Satellite</label>
        <label><input type="radio" name="base" value="plain"> Plain</label>
      </fieldset>

      <fieldset>
        <legend>Show on map</legend>
        <label><input type="checkbox" id="show-cities" checked> City names</label>
        <label><input type="checkbox" id="show-roads"> Roads</label>
        <label><input type="checkbox" id="show-borders" checked> Borders</label>
      </fieldset>

      <fieldset>
        <legend>Sea level rise</legend>
        <input type="range" id="level-slider" min="0" max="70" step="0.1" value="0" aria-label="Sea level rise in metres">
        <label class="level-box">Rise <input type="number" id="level-number" min="0" max="70" step="0.1" value="0.0" inputmode="decimal"> m</label>
        <p class="note" id="flood-status">Loading flood data…</p>
      </fieldset>
    </div>
  </aside>

  <div id="compass">
    <div id="compass-dial" role="button" tabindex="0" aria-label="Compass: drag to turn the map, click to face north">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="31" class="compass-face"/>
        <g id="compass-rose">
          <polygon points="32,15 37,32 27,32" class="needle-north"/>
          <polygon points="32,49 37,32 27,32" class="needle-south"/>
          <text x="32" y="11.5" class="compass-n">N</text>
          <text x="56" y="35.5">E</text>
          <text x="32" y="60">S</text>
          <text x="8" y="35.5">W</text>
        </g>
      </svg>
    </div>
    <div id="compass-turns">
      <button id="turn-left" type="button" aria-label="Turn left" title="Turn left">&#x21BA;</button>
      <button id="turn-right" type="button" aria-label="Turn right" title="Turn right">&#x21BB;</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="compass.js"></script>
  <script src="flood.js"></script>
</body>
</html>
